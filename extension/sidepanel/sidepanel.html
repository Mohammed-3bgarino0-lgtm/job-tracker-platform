<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مساعد قدّم الجانبي v1.3</title>
    <style>
        body {
            font-family: 'Tajawal', system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 14px;
            margin: 0;
        }
        .header {
            background: linear-gradient(135deg, #064e3b, #065f46);
            color: white;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .header h3 { margin: 0; font-size: 15px; font-weight: 800; }
        .btn {
            width: 100%;
            padding: 10px;
            background: #065f46;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .btn:hover { background: #064e3b; }
        .btn-outline { background: white; color: #065f46; border: 1px solid #a7f3d0; }
        
        .job-card {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .channel-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
        }
        .tag-email { background: #d1fae5; color: #065f46; }
        .tag-whatsapp { background: #dcfce7; color: #15803d; }
        .tag-form { background: #dbeafe; color: #1e40af; }
        .tag-link { background: #f1f5f9; color: #334155; }
        .tag-ocr { background: #fef3c7; color: #b45309; }

        .filter-btn { padding: 4px 8px; font-size: 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: bold; }
        .filter-btn.active { background: #065f46; color: white; border-color: #065f46; }
    </style>
</head>
<body>
    <div class="header">
        <h3>📌 قدّم | فحص ومحلل الإعلانات v1.3</h3>
        <span style="font-size: 10px;">بدون بيانات وهمية | فحص كروت ومصادر مستقلة</span>
    </div>

    <!-- Action Buttons -->
    <div style="margin-bottom:12px;">
        <button class="btn" onclick="scrapeCurrentActiveTab()"><i class="fa-solid fa-magnifying-glass"></i> فحص الصفحة الحالية المحملة</button>
        <div style="display:flex; gap:6px;">
            <button class="btn btn-outline" style="font-size:11px;" onclick="exportStoredJobsJSON()">تصدير JSON</button>
            <button class="btn btn-outline" style="font-size:11px; color:#dc2626;" onclick="clearStoredJobs()">إعادة ضبط</button>
        </div>
    </div>

    <!-- Filters -->
    <div style="display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap;">
        <button id="f-all" class="filter-btn active" onclick="setChannelFilter('all')">الكل</button>
        <button id="f-email" class="filter-btn" onclick="setChannelFilter('email')">📧 البريد</button>
        <button id="f-whatsapp" class="filter-btn" onclick="setChannelFilter('whatsapp')">💬 الواتساب</button>
        <button id="f-form" class="filter-btn" onclick="setChannelFilter('form')">📋 النماذج</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h4 style="font-size: 12px; font-weight: 800; margin:0;">النتائج المسحوبة (<span id="stored-count">0</span> / 300):</h4>
    </div>

    <div id="universal-jobs-list">
        <!-- Dynamic Jobs injected here -->
    </div>

    <script src="../adapters/universal-adapter.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
