version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qaddem_postgres
    restart: always
    environment:
      POSTGRES_USER: qaddem_user
      POSTGRES_PASSWORD: qaddem_password
      POSTGRES_DB: qaddem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
