version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://qaddem_user:qaddem_password@postgres:5432/qaddem_db?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: qaddem_postgres
    restart: always
    environment:
      POSTGRES_USER: qaddem_user
      POSTGRES_PASSWORD: qaddem_password
      POSTGRES_DB: qaddem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qaddem_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
