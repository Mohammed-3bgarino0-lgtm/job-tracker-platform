<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 16px;
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
        }
        h2 {
            font-size: 15px;
            color: #3b82f6;
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🤖 مساعد التقديم في Gmail</h2>
    <p>مرحباً بك أ. محمد السكران!</p>
    <p>عند فتح موقع <strong>Gmail</strong>، سيظهر لك مربع التقديم التلقائي في أسفل الشاشة لملء الإيميلات والخطابات التعريفية بنقرة واحدة.</p>
    <div style="margin-top: 12px;">
        <span class="status-badge">● الإضافة متصلة وبانتظار Gmail</span>
    </div>
</body>
</html>
