name: CI

on:
  pull_request:
    branches:
      - main
      - agent/resume-parser-review-ui
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, migrate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://qaddem:qaddem@localhost:5432/qaddem_ci?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaddem
          POSTGRES_PASSWORD: qaddem
          POSTGRES_DB: qaddem_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaddem -d qaddem_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply Prisma migrations to clean PostgreSQL
        run: pnpm db:deploy

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        shell: bash
        run: |
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Run tests
        shell: bash
        run: |
          pnpm test 2>&1 | tee tests.log

      - name: Build web application
        shell: bash
        run: |
          pnpm --filter @qaddem/web build 2>&1 | tee build.log

      - name: Build Chrome extension
        shell: bash
        run: |
          pnpm extension:build 2>&1 | tee extension-build.log

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaddem-chrome-extension-v1.7.0
          path: apps/extension/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-logs
          path: |
            typecheck.log
            tests.log
            build.log
            extension-build.log
          if-no-files-found: ignore
          retention-days: 3
