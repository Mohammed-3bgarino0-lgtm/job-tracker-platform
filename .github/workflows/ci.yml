name: CI

on:
  pull_request:
    branches:
      - main
      - agent/resume-parser-review-ui
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://qaddem:qaddem@localhost:5432/qaddem_ci?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile > install.log 2>&1
          status=$?
          tail -n 80 install.log
          exit $status

      - name: Upload dependency installation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-install-log
          path: install.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop after dependency installation failure
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build web application
        run: pnpm --filter @qaddem/web build
